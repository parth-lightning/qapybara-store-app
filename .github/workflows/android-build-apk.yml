name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Invalidate stale bundle cache
        run: |
          bundle_output=android/app/build/generated/assets/react/release/index.android.bundle
          if [ -f "$bundle_output" ]; then rm "$bundle_output"; fi

      - name: Build Android Release APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=4

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stillform-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
